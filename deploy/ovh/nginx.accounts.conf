server {
    listen 80;
    server_name _;
    root /srv/game/current;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/css;

    location = /healthz { return 200 "ok\n"; }
    location /internal/ { return 404; }
    location /static/ { alias /srv/account-static/; }
    location /parts/ { alias /srv/account-parts/; }
    location /game/ { alias /srv/game/current/account-game/; }
    location /v2/ { return 404; }
    location /legacy/ { alias /srv/game/current/; }
    location = /release.txt { try_files $uri =404; }
    # Keep release receiver checks and legacy relative assets available.
    location ~ ^/index\.(html|js|wasm|pck|png|audio\.worklet\.js)$ { try_files $uri =404; }
    location = /ws/ {
        proxy_pass http://authority:9080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location / {
        proxy_pass http://accounts:8000;
        proxy_set_header Host $host;
        # Port 8083 is reachable only through the trusted TLS gateway/loopback.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
