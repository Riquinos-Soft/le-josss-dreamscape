name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-checks:
    name: GDScript lint and format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check GDScript
        run: make lint

      - name: Test deployment safety
        run: python3 -m unittest discover -s deploy/ovh -p 'test_*.py'

  godot:
    name: Godot tests and Web export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -R /root/.local/share/godot/export_templates/4.7.2.stable \
            "$HOME/.local/share/godot/export_templates/"
          godot --version

      - name: Import project
        run: godot --headless --path game --import --quit

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_touch_controls.gd \
            test_movement_direction.gd \
            test_keyboard_input.gd \
            test_item_lifecycle.gd \
            test_courtyard.gd \
            test_street_scene.gd
          do
            godot --headless --path game --script "res://tests/$test"
          done

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path game --export-release Web ../build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Upload Web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dreamscape-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Web to OVH
    needs: [static-checks, godot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://dreamscape.198.244.233.153.sslip.io/
    concurrency:
      group: dreamscape-production
      cancel-in-progress: false
    steps:
      - name: Download tested Web export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dreamscape-web-${{ github.sha }}
          path: build/web

      - name: Configure restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dreamscape
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish and verify release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          tar -C build/web -czf "$RUNNER_TEMP/web.tar.gz" .
          ssh -i ~/.ssh/dreamscape -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            dreamscape-deploy@198.244.233.153 \
            "deploy $RELEASE_SHA $RELEASE_RUN" < "$RUNNER_TEMP/web.tar.gz"
          actual=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            https://dreamscape.198.244.233.153.sslip.io/release.txt)
          test "$actual" = "$RELEASE_SHA"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/dreamscape
